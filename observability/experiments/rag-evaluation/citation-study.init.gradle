gradle.projectsEvaluated {
    def appProject = gradle.rootProject.project(':app')
    def projectRoot = gradle.rootProject.projectDir
    def outputClasses = appProject.layout.buildDirectory.dir('citation-study/classes')
    appProject.tasks.register('compileCitationStudy', JavaCompile) {
        dependsOn appProject.tasks.named('classes')
        source new File(projectRoot, 'observability/experiments/rag-evaluation/RagCitationStudyMain.java')
        classpath = appProject.sourceSets.main.runtimeClasspath
        destinationDirectory = outputClasses
        options.encoding = 'UTF-8'
    }
    appProject.tasks.register('citationStudy', JavaExec) {
        dependsOn 'compileCitationStudy'
        classpath = appProject.files(outputClasses) + appProject.sourceSets.main.runtimeClasspath
        mainClass = 'interview.guide.experiments.RagCitationStudyMain'
        workingDir projectRoot
        systemProperty 'citation.inputs', appProject.findProperty('citationInputs')
        systemProperty 'citation.output', appProject.findProperty('citationOutput')
        systemProperty 'citation.offset', appProject.findProperty('citationOffset') ?: '0'
        systemProperty 'citation.limit', appProject.findProperty('citationLimit') ?: '4'
        args '--server.address=127.0.0.1', '--server.port=0',
            '--app.voice-interview.opening.warmup-enabled=false',
            '--app.ai.rag.chunking.mode=TOKEN', '--app.ai.rag.chunking.max-tokens=800',
            '--app.ai.rag.vector-task.durable-enabled=false'
    }
}
