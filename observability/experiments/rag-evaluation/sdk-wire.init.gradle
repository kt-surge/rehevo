// Local dependency experiment only. Main version catalog is not edited by this script.
gradle.beforeProject { project ->
    project.configurations.configureEach { configuration ->
        configuration.resolutionStrategy.eachDependency { details ->
            def candidate = project.findProperty('rehevoSdkVersion')
            if (candidate && details.requested.group == 'org.springframework.ai'
                && details.requested.version?.startsWith('2.0.')) {
                details.useVersion(candidate)
                details.because('Frozen local wire cancellation A/B; no production catalog mutation')
            }
        }
    }
}
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    def directory = new File(gradle.rootProject.projectDir, 'observability/experiments/rag-evaluation')
    def outputClasses = app.layout.buildDirectory.dir('sdk-wire/classes')
    app.tasks.register('sdkWireDependencies') {
        doLast {
            def artifacts = app.configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
            def rows = artifacts.collect {
                [group: it.moduleVersion.id.group, name: it.moduleVersion.id.name,
                 version: it.moduleVersion.id.version, file: it.file.absolutePath,
                 sha256: java.security.MessageDigest.getInstance('SHA-256')
                     .digest(it.file.bytes).encodeHex().toString()]
            }.sort { a, b -> (a.group + ':' + a.name) <=> (b.group + ':' + b.name) }
            def target = new File(app.findProperty('sdkWireOutput'), 'dependencies.json')
            target.parentFile.mkdirs()
            target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(rows))
        }
    }
    app.tasks.register('compileSdkWireProbe', JavaCompile) {
        dependsOn app.tasks.named('classes')
        source new File(directory, 'SdkWireCancellationProbe.java')
        classpath = app.sourceSets.main.runtimeClasspath
        destinationDirectory = outputClasses
        options.encoding = 'UTF-8'
    }
    app.tasks.register('sdkWireProbe', JavaExec) {
        dependsOn 'compileSdkWireProbe', 'sdkWireDependencies'
        classpath = app.files(outputClasses) + app.sourceSets.main.runtimeClasspath
        mainClass = 'interview.guide.common.ai.SdkWireCancellationProbe'
        workingDir gradle.rootProject.projectDir
        args app.findProperty('sdkWireOutput'), app.findProperty('rehevoSdkVersion') ?: app.libs.versions.springAi.get()
    }
}
