# Rehevo Configuration
# Rehevo 智能求职训练平台配置

logging:
  charset:
    console: UTF-8
    file: UTF-8

server:
  port: 8080
  # 明确指定HTTP响应编码
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# SpringDoc OpenAPI / Swagger配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: interview.guide.modules

spring:
  config:
    import: optional:classpath:voice-interview-opening.yml
  application:
    name: rehevo

  # 启用虚拟线程 (Java 21+)
  # 显著提升 I/O 密集型场景的并发能力，特别适合 AI 调用和 SSE 长连接
  threads:
    virtual:
      enabled: true

  # PostgreSQL数据库配置
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rehevo}
    username: ${POSTGRES_USER:postgres}
    # 与根目录 docker-compose.yml 中 postgres 服务默认一致（本地只起依赖容器 + bootRun 时无需改）
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update #首次启动用 create，表创建成功后，改回 update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB  # 支持知识库上传（简历限制在业务层检查）
      max-request-size: 50MB
  

  # Redisson配置 (使用 spring.redis.redisson，参考官方文档)
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
          database: 0
          connectionMinimumIdleSize: 10
          connectionPoolSize: 64
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 50
  
  # Spring AI 配置（chat + embedding 统一由 app.ai.providers 驱动，不使用自动配置）
  ai:
    # 禁用自动重试机制，让异常立即返回
    retry:
      max-attempts: 1  # 不重试，失败立即返回
      on-client-errors: false
    # PostgreSQL Vector Store配置
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024  # text-embedding-v3实际生成的向量维度
        initialize-schema: true # 开发环境设置为 true，方便快速启动。生产环境设置为 false，手动管理数据库 schema，避免意外变更。
        remove-existing-vector-store-table: false  # 保留现有表和数据

# Application custom configuration
app:
  ai:
    default-provider: dashscope
    default-embedding-provider: dashscope
    embedding-dimensions: ${APP_AI_EMBEDDING_DIMENSIONS:1024}
    # 每次模型 HTTP 调用的连接/读取上限；批次评分与结构化重试以此作为最内层故障边界。
    connect-timeout-ms: ${APP_AI_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${APP_AI_READ_TIMEOUT_MS:60000}
    # 固定实时面试与 RAG 的直接回答基线；可在部署配置中覆盖，不影响其他型号。
    # 方括号保留模型名中的点，防止 Map 绑定将其拆成嵌套字段。
    chat-extra-body-by-model:
      "[qwen3.8-flash]":
        enable_thinking: false
        preserve_thinking: false
    security:
      api-key-encryption-key: ${APP_AI_CONFIG_ENCRYPTION_KEY:}
      require-encryption-key: ${APP_AI_CONFIG_REQUIRE_ENCRYPTION_KEY:true}
      allow-fallback-encryption-key: ${APP_AI_CONFIG_ALLOW_FALLBACK_ENCRYPTION_KEY:false}
    # 运行时可写的 Provider 配置落点（与 classpath 主 application.yml 隔离）。
    # 开发环境默认写到用户主目录下，避免污染源码目录或 jar 内 classpath 资源。
    config-yaml-path: ${APP_AI_CONFIG_YAML_PATH:${user.home}/.rehevo/llm-providers.yml}
    config-env-path: ${APP_AI_CONFIG_ENV_PATH:${user.home}/.rehevo/llm-providers.env}
    agent-utils:
      skills-root: ${APP_AI_AGENT_UTILS_SKILLS_ROOT:classpath:skills}
    providers:
      dashscope:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        # 兼容已有的 Windows 用户环境变量 ALI-API-KEY；部署时优先使用标准变量 AI_BAILIAN_API_KEY。
        api-key: ${AI_BAILIAN_API_KEY:${ALI-API-KEY:}}
        model: ${AI_MODEL:qwen3.8-flash}
        embedding-model: qwen3.7-text-embedding
        embedding-dimensions: 1024
        supports-embedding: true
      lmstudio:
        base-url: http://localhost:1234
        api-key: ${PROVIDER_LMSTUDIO_API_KEY:lm-studio}
        model: qwen2.5-7b-instruct
        supports-embedding: false
      # ===== 预设 Provider（填完 API Key 后即可使用）=====
      # Moonshot AI / Kimi（OpenAI 兼容） https://platform.moonshot.cn/
      kimi:
        base-url: https://api.moonshot.cn/v1
        api-key: ${PROVIDER_KIMI_API_KEY:}
        model: ${PROVIDER_KIMI_MODEL:kimi-latest}
        temperature: 1
        supports-embedding: false
      # DeepSeek（OpenAI 兼容） https://api-docs.deepseek.com/
      deepseek:
        base-url: https://api.deepseek.com
        api-key: ${PROVIDER_DEEPSEEK_API_KEY:}
        model: ${PROVIDER_DEEPSEEK_MODEL:deepseek-v4-flash}
        supports-embedding: false
      # 智谱 AI / GLM（OpenAI 兼容） https://open.bigmodel.cn/
      glm:
        base-url: https://open.bigmodel.cn/api/coding/paas/v4
        api-key: ${PROVIDER_GLM_API_KEY:}
        model: ${PROVIDER_GLM_MODEL:glm-5}
        embedding-model: embedding-3
        embedding-dimensions: 1024
        supports-embedding: true
    advisors:
      enabled: ${APP_AI_ADVISORS_ENABLED:true}
      tool-call-enabled: ${APP_AI_ADVISORS_TOOL_CALL_ENABLED:true}
      tool-call-conversation-history-enabled: ${APP_AI_ADVISORS_TOOL_CALL_CONVERSATION_HISTORY_ENABLED:false}
      message-chat-memory-enabled: ${APP_AI_ADVISORS_MESSAGE_CHAT_MEMORY_ENABLED:false}
      message-chat-memory-max-messages: ${APP_AI_ADVISORS_MESSAGE_CHAT_MEMORY_MAX_MESSAGES:120}
      simple-logger-enabled: ${APP_AI_ADVISORS_SIMPLE_LOGGER_ENABLED:false}
    # 结构化输出重试次数（用于 BeanOutputConverter 解析失败时的业务层重试）
    structured-max-attempts: ${APP_AI_STRUCTURED_MAX_ATTEMPTS:2}
    # 重试时是否将上次错误原因注入提示词，帮助模型定向修复输出
    structured-include-last-error: ${APP_AI_STRUCTURED_INCLUDE_LAST_ERROR:true}
    # 是否启用“修复型重试提示词”（关闭后每次重试沿用原始 system prompt）
    structured-retry-use-repair-prompt: ${APP_AI_STRUCTURED_RETRY_USE_REPAIR_PROMPT:true}
    # 修复型重试提示词中是否追加严格 JSON 指令
    structured-retry-append-strict-json-instruction: ${APP_AI_STRUCTURED_RETRY_APPEND_STRICT_JSON_INSTRUCTION:true}
    # 注入到重试提示词中的错误信息最大长度
    structured-error-message-max-length: ${APP_AI_STRUCTURED_ERROR_MESSAGE_MAX_LENGTH:200}
    # 是否开启结构化输出调用指标（invocations/attempts/latency）
    structured-metrics-enabled: ${APP_AI_STRUCTURED_METRICS_ENABLED:true}
    # 是否启用 Spring AI 2.0 entity schema validation retry（失败时仍受 structured-max-attempts 外层控制）
    structured-schema-validation-enabled: ${APP_AI_STRUCTURED_SCHEMA_VALIDATION_ENABLED:true}
    rag:
      stream:
        deadline-seconds: ${APP_AI_RAG_STREAM_DEADLINE_SECONDS:180}
        max-active-sessions: ${APP_AI_RAG_STREAM_MAX_ACTIVE_SESSIONS:64}
        max-answer-characters: ${APP_AI_RAG_STREAM_MAX_ANSWER_CHARACTERS:200000}
        heartbeat-seconds: ${APP_AI_RAG_STREAM_HEARTBEAT_SECONDS:15}
      vector-task:
        # 执行租约/预算与完整故障门完成前，持久化恢复不默认开启。
        durable-enabled: ${APP_AI_RAG_VECTOR_TASK_DURABLE_ENABLED:false}
        scan-delay-ms: ${APP_AI_RAG_VECTOR_TASK_SCAN_DELAY_MS:1000}
        delivery-lease-ms: ${APP_AI_RAG_VECTOR_TASK_DELIVERY_LEASE_MS:10000}
        redelivery-delay-ms: ${APP_AI_RAG_VECTOR_TASK_REDELIVERY_DELAY_MS:30000}
        execution-lease-ms: ${APP_AI_RAG_VECTOR_TASK_EXECUTION_LEASE_MS:90000}
        heartbeat-delay-ms: ${APP_AI_RAG_VECTOR_TASK_HEARTBEAT_DELAY_MS:10000}
        max-execution-attempts: ${APP_AI_RAG_VECTOR_TASK_MAX_EXECUTION_ATTEMPTS:4}
        retry-delay-ms: ${APP_AI_RAG_VECTOR_TASK_RETRY_DELAY_MS:2000}
      chunking:
        # 默认沿用旧 TokenTextSplitter；STRUCTURED 仅在实验支持后显式启用。
        mode: ${APP_AI_RAG_CHUNKING_MODE:TOKEN}
        max-tokens: ${APP_AI_RAG_CHUNKING_MAX_TOKENS:800}
      rewrite:
        enabled: ${APP_AI_RAG_REWRITE_ENABLED:false}
      citation:
        enabled: ${APP_AI_RAG_CITATION_ENABLED:false}
      search:
        mode: ${APP_AI_RAG_RETRIEVAL_MODE:HYBRID}
        short-query-length: ${APP_AI_RAG_SHORT_QUERY_LENGTH:4}
        topk-short: ${APP_AI_RAG_TOPK_SHORT:20}
        topk-medium: ${APP_AI_RAG_TOPK_MEDIUM:12}
        topk-long: ${APP_AI_RAG_TOPK_LONG:8}
        min-score-short: ${APP_AI_RAG_MIN_SCORE_SHORT:0.18}
        min-score-default: ${APP_AI_RAG_MIN_SCORE_DEFAULT:0.28}
      hybrid:
        vector-candidates: ${APP_AI_RAG_VECTOR_CANDIDATES:20}
        lexical-candidates: ${APP_AI_RAG_LEXICAL_CANDIDATES:20}
        fusion-candidates: ${APP_AI_RAG_FUSION_CANDIDATES:20}
        rrf-k: ${APP_AI_RAG_RRF_K:60}
        vector-weight: ${APP_AI_RAG_VECTOR_WEIGHT:3.0}
        lexical-weight: ${APP_AI_RAG_LEXICAL_WEIGHT:1.0}
        initialize-schema: ${APP_AI_RAG_INITIALIZE_LEXICAL_SCHEMA:true}
      context-expansion:
        # 仅 HYBRID_CONTEXT 实验模式启用；默认 HYBRID 不扩大上下文。
        seed-chunks: ${APP_AI_RAG_CONTEXT_EXPANSION_SEED_CHUNKS:2}
        neighbors-per-seed: ${APP_AI_RAG_CONTEXT_EXPANSION_NEIGHBORS_PER_SEED:2}
      rerank:
        enabled: ${APP_AI_RAG_RERANK_ENABLED:false}
        workspace-id: ${DASHSCOPE_WORKSPACE_ID:}
        api-key: ${AI_BAILIAN_API_KEY:${ALI-API-KEY:}}
        model: ${APP_AI_RAG_RERANK_MODEL:qwen3-rerank}
        instruct: ${APP_AI_RAG_RERANK_INSTRUCT:Given a web search query, retrieve relevant passages that answer the query.}
      evidence-gate:
        mode: ${APP_AI_RAG_EVIDENCE_GATE_MODE:OBSERVE}
      routing:
        # 仅观察路由建议；尚无独立冻结集支撑自动澄清或拒答。
        mode: ${APP_AI_RAG_ROUTING_MODE:OBSERVE}

  interview:
    follow-up-count: ${APP_INTERVIEW_FOLLOW_UP_COUNT:1}
    live-follow-up:
      # 当前只观察并返回建议；不因模型或启发式结论自动跳过候选人题目。
      mode: ${APP_INTERVIEW_LIVE_FOLLOW_UP_MODE:OBSERVE}
      minimum-answer-characters: ${APP_INTERVIEW_LIVE_FOLLOW_UP_MINIMUM_ANSWER_CHARACTERS:40}
      minimum-key-point-hits: ${APP_INTERVIEW_LIVE_FOLLOW_UP_MINIMUM_KEY_POINT_HITS:1}
    evaluation:
      batch-size: ${APP_INTERVIEW_EVALUATION_BATCH_SIZE:8}
      # 默认串行；提高前必须用同一 Provider 的受控实验确认不放大限流与失败率。
      max-concurrent-batches: ${APP_INTERVIEW_EVALUATION_MAX_CONCURRENT_BATCHES:1}
      batch-executor-queue-capacity: ${APP_INTERVIEW_EVALUATION_BATCH_EXECUTOR_QUEUE_CAPACITY:16}
      failed-item-retry-limit: ${APP_INTERVIEW_EVALUATION_FAILED_ITEM_RETRY_LIMIT:3}
      # 整份报告的模型调用预算；耗尽后返回已完成部分并标记其余题为评估失败。
      request-deadline-seconds: ${APP_INTERVIEW_EVALUATION_REQUEST_DEADLINE_SECONDS:180}
      benchmark-enabled: ${APP_INTERVIEW_EVALUATION_BENCHMARK_ENABLED:false}
  resume:
    upload-dir: ${java.io.tmpdir}/rehevo/resumes
    allowed-types:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain

  # RustFS (S3兼容) 存储配置
  storage:
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    # 本地 Docker RustFS 默认凭据为 rustfsadmin；部署环境使用 RUSTFS_* 覆盖。
    access-key: ${RUSTFS_ACCESS_KEY:rustfsadmin}
    secret-key: ${RUSTFS_SECRET_KEY:rustfsadmin}
    bucket: ${APP_STORAGE_BUCKET:rehevo}
    region: ${APP_STORAGE_REGION:us-east-1}
    api-call-timeout: ${APP_STORAGE_API_CALL_TIMEOUT:60s}
    api-call-attempt-timeout: ${APP_STORAGE_API_CALL_ATTEMPT_TIMEOUT:20s}
    auto-create-bucket: ${APP_STORAGE_AUTO_CREATE_BUCKET:true}
  
  # CORS配置 - React前端
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:80,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:80}

  # Voice interview configuration
  voice-interview:
    # Phase duration settings (minutes)
    phase:
      intro:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MIN_DURATION:3}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_INTRO_SUGGESTED_DURATION:5}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MAX_DURATION:8}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MIN_QUESTIONS:2}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MAX_QUESTIONS:5}
      tech:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_TECH_MIN_DURATION:8}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_TECH_SUGGESTED_DURATION:10}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_TECH_MAX_DURATION:15}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_TECH_MIN_QUESTIONS:3}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_TECH_MAX_QUESTIONS:8}
      project:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MIN_DURATION:8}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_SUGGESTED_DURATION:10}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MAX_DURATION:15}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MIN_QUESTIONS:2}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MAX_QUESTIONS:5}
      hr:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_HR_MIN_DURATION:3}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_HR_SUGGESTED_DURATION:5}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_HR_MAX_DURATION:8}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_HR_MIN_QUESTIONS:2}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_HR_MAX_QUESTIONS:5}

    # TTS configuration
    tts:
      default-voice: ${APP_VOICE_INTERVIEW_TTS_DEFAULT_VOICE:siyue}  # 思悦 - 温柔自然的女声

    # Qwen-Audio streaming ASR/TTS configuration
    qwen:
      asr:
        url: wss://dashscope.aliyuncs.com/api-ws/v1/inference
        model: qwen-audio-3.0-asr-flash-streaming
        api-key: ${AI_BAILIAN_API_KEY:${ALI-API-KEY:}}
        language: zh
        format: pcm
        sample-rate: 16000
        enable-turn-detection: true
        turn-detection-type: server_vad
        turn-detection-threshold: 0.0
        # 静音多久判为一句结束；中文面试思考停顿常见 2-3s，设 2000 避免句中切段
        turn-detection-silence-duration-ms: ${APP_VOICE_ASR_SILENCE_MS:2000}

      # 音色列表文档：https://help.aliyun.com/zh/model-studio/qwen-audio-tts-voice-list
      tts:
        model: ${APP_VOICE_TTS_MODEL:qwen-audio-3.1-tts-flash}
        api-key: ${AI_BAILIAN_API_KEY:${ALI-API-KEY:}}
        voice: ${APP_VOICE_TTS_VOICE:longanhuan_v3.1}
        format: pcm
        sample-rate: 24000
        mode: commit
        language-type: Chinese
        speech-rate: 1.0
        volume: 60

    # 用户说完一小段 STT 定稿后，再等多久（毫秒）才触发面试官回复；需大于 VAD 静音阈值以确保用户继续说话时 partials 能取消
    user-utterance-debounce-ms: ${APP_VOICE_USER_UTTERANCE_DEBOUNCE_MS:2500}
    # 触发提交前要求的最小静音时长（毫秒），从最后一次 STT 活动（含 partial）算起
    min-silence-before-commit-ms: ${APP_VOICE_MIN_SILENCE_BEFORE_COMMIT_MS:2500}
    # 当内容较短时先不提交，等待继续说（字符数）
    min-commit-chars: ${APP_VOICE_MIN_COMMIT_CHARS:20}
    # 最长等待用户继续补充的时间（毫秒），超时后强制提交
    max-wait-for-continuation-ms: ${APP_VOICE_MAX_WAIT_FOR_CONTINUATION_MS:7000}
    # 语音面试单轮面试官回复最大长度（字符）
    ai-question-max-chars: ${APP_VOICE_AI_QUESTION_MAX_CHARS:120}
    ai-question-timeout-seconds: ${APP_VOICE_AI_QUESTION_TIMEOUT_SECONDS:20}
    role-history-enabled: ${APP_VOICE_ROLE_HISTORY_ENABLED:false}
    # 是否按句子边合成边推送语音；开启后首段语音不用等待完整回复生成结束
    chunked-audio-enabled: ${APP_VOICE_CHUNKED_AUDIO_ENABLED:true}
    skill-preload-enabled: ${APP_VOICE_SKILL_PRELOAD_ENABLED:false}
    # 单句 TTS 合成超时，避免某一句卡住整轮播放
    tts-timeout-seconds: ${APP_VOICE_TTS_TIMEOUT_SECONDS:8}
    # 单会话并发 TTS 上限，控制首段语音速度和服务连接压力
    max-concurrent-tts-per-session: ${APP_VOICE_MAX_CONCURRENT_TTS_PER_SESSION:3}
    # 实验性同句帧流；浏览器完整验收前默认关闭
    frame-tts:
      enabled: ${APP_VOICE_FRAME_TTS_ENABLED:false}
      max-pending-sentences: ${APP_VOICE_FRAME_TTS_MAX_PENDING_SENTENCES:16}
      max-buffered-bytes: ${APP_VOICE_FRAME_TTS_MAX_BUFFERED_BYTES:720000}

    # Rate limiting
    rate-limit:
      max-per-session: ${APP_VOICE_INTERVIEW_RATE_LIMIT_MAX_PER_SESSION:10}  # messages per second
      max-per-ip: ${APP_VOICE_INTERVIEW_RATE_LIMIT_MAX_PER_IP:3}  # interviews per hour
      max-concurrent: ${APP_VOICE_INTERVIEW_RATE_LIMIT_MAX_CONCURRENT:50}  # global concurrent interviews

    # Audio specifications
    audio:
      codec: ${APP_VOICE_INTERVIEW_AUDIO_CODEC:opus}
      sample-rate: ${APP_VOICE_INTERVIEW_AUDIO_SAMPLE_RATE:16000}
      bit-rate: ${APP_VOICE_INTERVIEW_AUDIO_BIT_RATE:24000}
      channels: ${APP_VOICE_INTERVIEW_AUDIO_CHANNELS:1}
      chunk-duration: ${APP_VOICE_INTERVIEW_AUDIO_CHUNK_DURATION:2000}  # 2 seconds

management:
  metrics:
    distribution:
      # 仅为 0.3 看板与告警所需的业务 Timer 发布可聚合直方图；避免对所有指标增加基数和存储成本。
      percentiles-histogram:
        app.rag.retrieval: true
        app.rag.answer: true
        app.async.stream.processing: true
        app.voice.interview.llm.first_token_latency: true
        app.voice.interview.first_audio_latency: true
        app.voice.interview.tts.duration: true
        app.voice.interview.turn.duration: true
        app.voice.interview.turn.stage_latency: true
        app.voice.interview.client.first_audio_received_latency: true
        app.voice.interview.client.playback_start_latency: true
      slo:
        app.voice.interview.llm.first_token_latency: 1s,3s,5s,10s,15s,20s,30s,45s,60s,90s
        app.voice.interview.first_audio_latency: 1s,3s,5s,10s,15s,20s,30s,45s,60s,90s
        app.voice.interview.turn.duration: 1s,3s,5s,10s,15s,20s,30s,45s,60s,90s
        app.voice.interview.turn.stage_latency: 1s,3s,5s,10s,15s,20s,30s,45s,60s,90s
        app.voice.interview.client.first_audio_received_latency: 100ms,250ms,500ms,1s,2s,3s,5s,10s,20s,45s,90s,120s
        app.voice.interview.client.playback_start_latency: 100ms,250ms,500ms,1s,2s,3s,5s,10s,20s,45s,90s,120s
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
